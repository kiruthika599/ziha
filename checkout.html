<!DOCTYPE html>
<html>
<head>
  <title>Checkout - Ziha</title>
  <link rel="stylesheet" href="chechout.css">
</head>
<body bgcolor="#FFF0F5">

  <header>
    <h1>🧾 Ziha Checkout</h1>
    <nav>
      <a href="shop.html" class="bal">Back to Shop</a>
      <a href="cart.html" class="ral">View Cart</a>
    </nav>
  </header>

  <section class="checkout-container">
   <center> <h2>Order Summary</h2>
    <div id="orderSummary"></div></center>

   <center> <h2>Delivery Details</h2>
    <form id="checkoutForm">
      <input type="text" placeholder="Full Name" required><br>
      <input type="text" placeholder="Address" required><br>
      <input type="text" placeholder="City" required><br>
      <input type="text" placeholder="Pincode" required><br>
      <input type="tel" placeholder="Phone Number" required><br>
      <button type="submit">Place Order</button>
    </form>
  </section></center>

  <script src="checkout.js"></script>
</body>
</html>
