<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopZiha - Products</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- 🔝 Navbar -->
  <header class="navbar">
    <div class="logo">ShopZiha</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Shop</a></li>
        <li><a href="cart.html"><i class="fa fa-shopping-cart"></i> Cart</a></li>
        <li><a href="auth.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <!-- 🛍️ Products Section -->
  <section class="products-page">
    <h2>All Products</h2>
    <div class="product-grid">
      <!-- Product 1 -->
      <div class="product-card">
        <img src="assets/images/product1.jpg" alt="Gold Necklace">
        <h3>Gold Necklace</h3>
        <p>₹5,499</p>
        <button class="btn">Add to Cart</button>
      </div>
      <!-- Product 2 -->
      <div class="product-card">
        <img src="assets/images/product2.jpg" alt="Lipstick Set">
        <h3>Lipstick Set</h3>
        <p>₹799</p>
        <button class="btn">Add to Cart</button>
      </div>
      <!-- Product 3 -->
      <div class="product-card">
        <img src="assets/images/product3.jpg" alt="Rose Perfume">
        <h3>Rose Perfume</h3>
        <p>₹1,299</p>
        <button class="btn">Add to Cart</button>
      </div>
      <!-- Product 4 -->
      <div class="product-card">
        <img src="assets/images/product4.jpg" alt="Bangle Set">
        <h3>Bangle Set</h3>
        <p>₹1,999</p>
        <button class="btn">Add to Cart</button>
      </div>
    </div>
  </section>

  <!-- 📩 Footer -->
  <footer class="footer">
    <p>© 2025 ShopZiha | Made with 💖 by Kiki</p>
  </footer>

</body>
</html>
