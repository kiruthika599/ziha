<!DOCTYPE html>

</head>
<body bgcolor="#FBEAEA">

  <header>
    <h1>Ziha</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="cart.html"><i class="fa fa-shopping-cart"></i> Cart</a>
    </nav>
  </header>

  <!-- 🌸 Filter Buttons -->
  <section class="filters">
    <h3>Filter by Category</h3>
    <button onclick="filterProducts('all')">All</button>
    <button onclick="filterProducts('lipstick')">Lipstick</button>
    <button onclick="filterProducts('eyeliner')">Eyeliner</button>
    <button onclick="filterProducts('foundation')">Foundation</button>
  </section>

  <!-- 🌸 Product Display Section -->
  <section class="product-list" id="productList">
    <!-- Products will appear here using JavaScript -->
  </section>

  <!-- 🌸 JavaScript File -->
  <script src="shop.js"></script>

</body>
</html>
